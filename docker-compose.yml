version: '3.8'

services:
  # --- BACKEND PRINCIPAL ---
  backend-central:
    build:
      context: ./backend_central
      dockerfile: Dockerfile
    container_name: backend-central
    ports:
      - "4000:4000"
    env_file:
      - ./backend_central/.env
    environment:
      - PORT=4000
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=postgres
      - JWT_SECRET=mysecretkey
      - API_FINANZAS=http://finanzas:3001/api/finanzas/linea-captura
      - API_REPUVE=http://mock-server:8000/api/semovi/vehiculo
      - API_SEMOVI_CONDUCTORES=http://mock-server:8000/api/semovi/licencia/
    networks:
      - fepi-net
    
    # AQUÍ ESTÁ EL CAMBIO CLAVE:
    depends_on:
      db:
        condition: service_healthy  
      mock-server:
        condition: service_started  
      finanzas:
        condition: service_started  

  # --- MOCK SERVER ---
  mock-server:
    build:
      context: ./backend_externo/mockServer
    container_name: mock-server
    ports:
      - "8000:8000"
    command: sh -c "python populate_db.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - fepi-net

  # --- FINANZAS ---
  finanzas:
    build:
      context: ./backend_externo/finanzas
    container_name: finanzas
    ports:
      - "3001:3001"
    networks:
      - fepi-net

  # --- BACKEND GRUAS ---
  backend-gruas:
    build:
      context: ./backend_gruas
      dockerfile: Dockerfile
    container_name: backend-gruas
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_HOST=postgres_db_gruas
      - DB_NAME=postgres
      - DB_PORT=5432
    networks:
      - fepi-net
    depends_on:
      db_gruas:
        condition: service_healthy
    restart: on-failure

  # --- BASE DE DATOS PRINCIPAL ---
  db:
    build:
      context: ./shared_dtos/datos/container 
      dockerfile: Dockerfile
    container_name: postgres_db
    restart: always
    ports:
      - "5430:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fepi-net
    
    # AGREGAMOS EL HEALTHCHECK AQUÍ:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s    
      timeout: 5s     
      retries: 5     

  # --- BASE DE DATOS GRUAS ---
  db_gruas:
    build:
      context: ./backend_gruas/base_datos
      dockerfile: Dockerfile
    container_name: postgres_db_gruas
    restart: always
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data_gruas:/var/lib/postgresql/data
    networks:
      - fepi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  fepi-net:
    driver: bridge

volumes:
  postgres_data:
  postgres_data_gruas: